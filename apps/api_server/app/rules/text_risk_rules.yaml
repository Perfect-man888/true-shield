version: "2.0.0"

thresholds:
  medium: 25
  high: 60

scoring:
  mode: highest_per_category
  max_total: 100

rules:
  - id: R-TEXT-001
    enabled: true
    category: payment
    tags:
      - 资金请求
      - 转账付款
    title: 出现转账或借款请求
    score: 25
    match:
      any:
        - "转账"
        - "汇款"
        - "打钱"
        - "借我"
        - "借点钱"
        - "借钱"
        - "付款"
        - "收款码"
        - "把钱转过来"
        - "把款转过来"
        - "把钱打过来"
    explanation: 文本中出现了直接的资金操作请求。
    advice: 在确认身份和收款账户前，不要转账或付款。

  - id: R-TEXT-002
    category: urgency
    tags:
      - 时间压力
      - 紧急催促
    title: 对方制造时间压力
    score: 15
    match:
      any:
        - "马上"
        - "立刻"
        - "赶紧"
        - "现在就"
        - "最后机会"
        - "来不及了"
        - "不许挂电话"
    explanation: 对方使用紧迫表达压缩核验和思考时间。
    advice: 暂停当前操作，至少留出时间独立核验。

  - id: R-TEXT-003
    category: secrecy
    tags:
      - 要求保密
      - 阻止求助
    title: 对方要求保密
    score: 20
    match:
      any:
        - "不要告诉别人"
        - "别告诉家里人"
        - "保密"
        - "谁也别说"
        - "不要声张"
      exclude_any:
        - "不要告诉别人验证码"
        - "不要告诉任何人验证码"
        - "验证码不要告诉别人"
        - "验证码不能告诉别人"
        - "警方提醒"
        - "反诈提醒"
    explanation: 要求对交易或联系内容保密是常见操纵信号。
    advice: 不要独自处理，立即向可信家人或联系人求助。

  - id: R-TEXT-004
    category: impersonation
    tags:
      - 身份冒充
      - 亲友冒充
    title: 存在身份冒充话术
    score: 20
    match:
      any:
        - "我是你儿子"
        - "我是你女儿"
        - "我是你领导"
        - "我是老师"
        - "手机坏了"
        - "换新号码了"
        - "这是我的新号"
    explanation: 对方声称更换号码或以亲属、领导、老师身份提出请求。
    advice: 退出当前会话，通过原号码或当面方式核验身份。

  - id: R-TEXT-005
    category: credential
    title: 对方索取短信验证码
    score: 60
    force_level: high
    match:
      any:
        - "验证码"
        - "短信码"
        - "动态码"
      exclude_any:
        - "不要提供验证码"
        - "切勿提供验证码"
        - "不要告诉任何人验证码"
    explanation: 验证码可能被用于登录账号、修改密码或完成支付。
    advice: 绝对不要向对方提供任何验证码。

  - id: R-TEXT-006
    category: remote_control
    title: 对方诱导远程控制或屏幕共享
    score: 60
    force_level: high
    match:
      any:
        - "屏幕共享"
        - "远程控制"
        - "远程协助"
        - "下载会议软件"
        - "安装远程软件"
        - "打开共享屏幕"
    explanation: 远程控制或屏幕共享可能泄露密码、验证码和支付界面。
    advice: 不要安装对方指定的软件，也不要开启屏幕共享。

  - id: R-TEXT-007
    category: authority
    title: 公检法安全账户话术
    score: 80
    force_level: high
    match:
      all_groups:
        - ["公安", "警察", "检察院", "法院"]
        - ["安全账户", "涉案账户", "资金审查", "资金清查"]
    explanation: 公检法机关不会通过聊天要求向所谓安全账户转账。
    advice: 立即挂断，通过公开官方渠道核实，不要按对方要求转账。

  - id: R-TEXT-008
    category: investment
    title: 高收益或保本投资诱导
    score: 40
    match:
      all_groups:
        - ["投资", "理财", "项目", "股票", "基金"]
        - ["稳赚", "保本", "高回报", "内幕消息", "稳赚不赔"]
    explanation: 承诺保本或异常高收益属于典型投资诈骗信号。
    advice: 不要向私人账户或陌生平台充值，先核验平台资质。

  - id: R-TEXT-009
    category: fake_service
    title: 客服退款或理赔诱导
    score: 35
    match:
      all_groups:
        - ["客服", "退款", "理赔", "取消会员", "关闭扣费"]
        - ["点击链接", "打开链接", "下载软件", "共享屏幕", "验证码"]
    explanation: 冒充客服常以退款、理赔或取消扣费为由诱导点击链接或提供凭证。
    advice: 退出聊天，直接从官方 App 或官网进入客服渠道核验。

  - id: R-TEXT-010
    category: loan
    title: 贷款前置收费
    score: 45
    match:
      all_groups:
        - ["贷款", "放款", "额度"]
        - ["保证金", "解冻费", "手续费", "刷流水"]
    explanation: 正常贷款通常不会要求先交保证金、解冻费或刷流水。
    advice: 不要支付任何前置费用，并通过正规金融机构核实。

  - id: R-TEXT-011
    category: crypto
    title: 虚拟币或非正规支付要求
    score: 30
    match:
      any:
        - "虚拟币"
        - "数字货币"
        - "USDT"
        - "泰达币"
        - "礼品卡充值"
    explanation: 虚拟币和礼品卡交易难以追回，常被用于规避正常支付渠道。
    advice: 不要按陌生人的要求购买或转移虚拟币、礼品卡。

  - id: R-TEXT-012
    category: composite
    tags:
      - 复合诈骗
      - 身份冒充
      - 紧急转账
      - 要求保密
    title: 冒充身份并紧急要求秘密转账
    score: 50
    force_level: high
    match:
      all_groups:
        - [
            "我是你儿子",
            "我是你女儿",
            "我是你领导",
            "我是老师",
            "手机坏了",
            "换新号码了",
          ]
        - ["转账", "汇款", "打钱", "借钱", "付款"]
        - ["马上", "立刻", "赶紧", "现在就", "来不及了"]
        - ["不要告诉别人", "别告诉家里人", "保密", "谁也别说"]
    explanation: 身份变化、紧急资金请求和保密要求同时出现，构成高风险组合。
    advice: 立即停止付款，通过原号码联系本人，并通知可信家人协助核验。

  - id: "R-COMBO-001"
    enabled: true
    category: "fraud_chain"
    title: "冒充公检法并诱导转入安全账户"
    score: 80
    explanation: "文本同时出现公检法身份、违法恐吓、保密要求、紧急施压和资金转移要求，符合典型冒充公检法诈骗链条。"
    tags:
      - "冒充公检法"
      - "违法恐吓"
      - "要求保密"
      - "紧急施压"
      - "安全账户"
    advice: "立即停止转账或汇款，不要相信所谓的安全账户；通过官方公开电话联系公安机关核实；立即告知家人或可信联系人；如已转账，请联系银行止付并拨打 96110 或 110。"
    match:
      all_groups:
        - ["公安局", "公安机关", "公检法", "警察", "检察院", "法院"]
        - [
            "涉嫌洗钱",
            "涉嫌犯罪",
            "涉嫌违法",
            "涉嫌诈骗",
            "涉嫌案件",
            "已经立案",
          ]
        - [
            "不能告诉家人",
            "不要告诉家人",
            "不得告诉家人",
            "不能对外说",
            "必须保密",
            "不要声张",
          ]
        - ["马上", "立即", "立刻", "必须", "现在"]
        - ["安全账户", "转到安全账户", "把钱转到", "把钱转过来", "转账", "汇款"]
      exclude_any:
        - "警方提醒"
        - "公安提醒"
        - "反诈提醒"
        - "防骗提醒"
        - "国家反诈中心提醒"
        - "公检法不会要求"
        - "不会要求群众转账"
        - "不存在安全账户"

  - id: "R-COMBO-002"
    enabled: true
    category: "fraud_chain"
    title: "冒充客服退款并索要验证码"
    score: 75
    explanation: "文本同时出现客服身份、订单或退款理由、紧急操作要求和索要验证码行为，符合典型冒充客服退款诈骗链条。"
    tags:
      - "冒充客服"
      - "退款理赔"
      - "紧急操作"
      - "索要验证码"
    advice: "不要向任何人提供短信验证码、支付验证码或登录验证码；停止与对方继续沟通，不要点击退款链接；通过购物平台官方入口联系真实客服核实；如已泄露验证码，请立即修改密码并联系银行。"
    match:
      all_groups:
        - [
            "平台客服",
            "官方客服",
            "客服人员",
            "售后客服",
            "电商客服",
            "商家客服",
          ]
        - [
            "订单出现异常",
            "订单异常",
            "商品异常",
            "账户异常",
            "快递异常",
            "办理退款",
            "申请退款",
            "退款",
            "理赔",
          ]
        - ["立即", "马上", "立刻", "现在", "尽快"]
        - ["短信验证码", "登录验证码", "支付验证码", "验证码"]
      exclude_any:
        - "反诈提醒"
        - "防骗提醒"
        - "不要提供验证码"
        - "请勿提供验证码"
        - "不能提供验证码"
        - "不会索要验证码"
        - "客服不会要求提供验证码"

  - id: R-TEXT-013
    category: sensitive_info
    tags:
      - 身份信息
      - 银行卡信息
    title: 索取身份证或银行卡敏感信息
    score: 45
    match:
      all_groups:
        - ["发给我", "提供", "上传", "拍照", "截图", "填写"]
        - ["身份证", "银行卡", "银行卡号", "支付密码", "身份证照片", "人脸验证"]
      exclude_any:
        - "不要提供身份证"
        - "不要提供银行卡"
        - "切勿上传身份证"
        - "请勿透露银行卡"
    explanation: 对方要求提交身份证、银行卡、支付密码或人脸验证信息，可能用于身份盗用或账户接管。
    advice: 不要通过聊天发送身份证、银行卡、支付密码或人脸验证资料。

  - id: R-TEXT-014
    category: link
    tags:
      - 可疑链接
      - 二维码
    title: 诱导点击链接或扫描二维码
    score: 30
    match:
      all_groups:
        - ["点击", "打开", "进入", "扫码", "扫描", "识别二维码"]
        - ["链接", "网址", "二维码", "页面", "小程序"]
      exclude_any:
        - "不要点击陌生链接"
        - "请勿扫描陌生二维码"
        - "不要打开可疑网址"
    explanation: 陌生链接或二维码可能指向仿冒登录页、恶意安装包或虚假付款页面。
    advice: 不要直接打开对方发送的链接或二维码，应从官方 App 或官网进入。

  - id: R-TEXT-015
    category: software_install
    tags:
      - 安装软件
      - 恶意应用
    title: 诱导安装未知应用或远程工具
    score: 55
    match:
      all_groups:
        - ["安装", "下载", "装一下", "打开安装包"]
        - ["APK", "安装包", "ToDesk", "AnyDesk", "TeamViewer", "向日葵", "远程软件", "会议软件"]
      exclude_any:
        - "不要安装陌生软件"
        - "请勿下载未知安装包"
    explanation: 陌生安装包或远程工具可能获取屏幕、短信、相册和支付操作权限。
    advice: 不要安装对方指定的 APK、远程控制或屏幕共享软件。

  - id: R-TEXT-016
    category: task_scam
    tags:
      - 刷单返利
      - 兼职诈骗
    title: 刷单、做任务或点赞返利
    score: 50
    match:
      all_groups:
        - ["刷单", "做任务", "点赞", "关注", "兼职", "抢单", "垫付"]
        - ["返利", "返现", "佣金", "本金返还", "连本带佣", "高额回报", "充值", "补单"]
    explanation: 以简单任务和小额返利建立信任，再要求充值或垫付，是常见刷单诈骗路径。
    advice: 不要为兼职任务充值、垫付或向私人账户付款。

  - id: R-TEXT-017
    category: prize
    tags:
      - 虚假中奖
      - 前置费用
    title: 中奖、礼品或抽奖领取前收费
    score: 45
    match:
      all_groups:
        - ["中奖", "抽中", "礼品", "奖金", "免费领取", "幸运用户"]
        - ["手续费", "税费", "保证金", "邮费", "激活费", "先付款"]
    explanation: 正常奖品领取通常不会要求向私人账户预付税费、保证金或激活费。
    advice: 不要支付任何领奖前置费用，并通过活动主办方官方渠道核实。

  - id: R-TEXT-018
    category: romance_investment
    tags:
      - 情感诱导
      - 投资诈骗
    title: 情感关系中诱导投资或购买虚拟币
    score: 60
    force_level: high
    match:
      all_groups:
        - ["宝贝", "亲爱的", "为了我们的未来", "带你赚钱", "内部渠道", "老师带单"]
        - ["投资", "理财", "虚拟币", "USDT", "数字货币", "充值平台"]
        - ["稳赚", "保本", "高收益", "翻倍", "内幕", "只赚不赔"]
    explanation: 通过情感关系建立信任后诱导进入虚假投资平台，符合“杀猪盘”常见特征。
    advice: 停止充值和转账，不要相信网友提供的投资平台或收益截图。

  - id: R-TEXT-019
    category: education_refund
    tags:
      - 培训退款
      - 群聊诱导
    title: 培训费、学费或课程退款诱导
    score: 45
    match:
      all_groups:
        - ["培训机构", "课程", "学费", "培训费", "教育机构"]
        - ["退费", "退款", "清退", "返还学费"]
        - ["加入群聊", "下载软件", "登记银行卡", "购买证券", "认购基金", "点击链接"]
    explanation: 冒充教育机构办理退费并诱导下载软件、投资或提交银行卡，是常见复合诈骗。
    advice: 直接联系原培训机构官方客服，不要加入陌生退费群或购买所谓退款证券。

  - id: R-TEXT-020
    category: social_security
    tags:
      - 社保医保
      - 账户异常
    title: 冒充社保、医保或税务机构要求验证
    score: 45
    match:
      all_groups:
        - ["社保", "医保", "医疗保险", "税务", "电子社保卡"]
        - ["停用", "失效", "异常", "未认证", "即将冻结", "需要更新"]
        - ["点击链接", "提供银行卡", "验证码", "人脸识别", "下载APP"]
    explanation: 以社保、医保或税务账户异常为由索取凭证或诱导点击链接，存在账户盗用风险。
    advice: 通过政府官方 App、网站或公开服务热线核实，不要使用短信中的链接。

  - id: R-TEXT-021
    category: traffic_service
    tags:
      - ETC
      - 交通违法
    title: ETC、交通违法或车辆业务异常链接
    score: 40
    match:
      all_groups:
        - ["ETC", "高速通行", "交通违法", "违章", "车辆年检", "驾驶证"]
        - ["失效", "异常", "逾期", "冻结", "需要认证", "补缴"]
        - ["点击链接", "在线办理", "缴费", "填写银行卡", "验证码"]
    explanation: 交通业务异常短信常通过仿冒页面窃取银行卡和验证码。
    advice: 通过交管 12123、ETC 官方渠道或银行官方客服核实。

  - id: R-TEXT-022
    category: parcel_compensation
    tags:
      - 快递理赔
      - 丢件赔偿
    title: 冒充快递或物流人员办理赔偿
    score: 45
    match:
      all_groups:
        - ["快递", "包裹", "物流", "快递员", "快递客服"]
        - ["丢失", "损坏", "污染", "理赔", "赔偿", "退款"]
        - ["银行卡", "验证码", "点击链接", "共享屏幕", "下载软件"]
    explanation: 冒充快递理赔并索取银行卡、验证码或远程协助，是常见诈骗手法。
    advice: 只通过购物平台订单页或快递公司官方渠道发起理赔。

  - id: R-TEXT-023
    category: credit_repair
    tags:
      - 征信修复
      - 债务优化
    title: 征信修复、消除记录或债务优化收费
    score: 45
    match:
      all_groups:
        - ["征信", "信用记录", "逾期记录", "债务", "网贷记录"]
        - ["修复", "消除", "洗白", "删除记录", "优化债务", "内部处理"]
        - ["服务费", "手续费", "保证金", "先付款", "转账"]
    explanation: 个人或机构声称可内部删除征信记录并提前收费，通常不可信。
    advice: 不要支付所谓征信修复费用，应向金融机构和官方征信渠道咨询。

  - id: R-TEXT-024
    category: account_takeover
    tags:
      - 账户冻结
      - 解冻验证
    title: 以账户冻结或违规为由要求解冻操作
    score: 50
    match:
      all_groups:
        - ["账户", "账号", "银行卡", "支付账户", "微信", "支付宝"]
        - ["冻结", "封禁", "异常登录", "违规", "涉嫌洗钱", "即将停用"]
        - ["解冻", "验证身份", "提供验证码", "转入资金", "安全认证", "点击链接"]
    explanation: 以账号即将冻结为由制造恐慌，常用于诱导提交验证码或转移资金。
