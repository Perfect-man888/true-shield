[project]
name = "true-shield-api"
version = "0.1.0"
description = "真信盾家庭级 AI 反诈与可信联系系统后端 API"
requires-python = ">=3.12,<3.13"

dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi[standard-no-fastapi-cloud-cli]",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
