[project]
name = "true-shield-api"
version = "0.1.0"
description = "真信盾家庭级 AI 反诈与可信联系系统后端 API"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"