name: true-shield

services:
  postgres:
    image: postgres:16-alpine
    container_name: true-shield-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - true_shield_network

  redis:
    image: redis:7.4-alpine
    container_name: true-shield-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - true_shield_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: true-shield-minio
    restart: unless-stopped

    command:
      - server
      - /data
      - --console-address
      - ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

    networks:
      - true_shield_network

volumes:
  postgres_data:
    name: true-shield-postgres-data

  redis_data:
    name: true-shield-redis-data

  minio_data:
    name: true-shield-minio-data

networks:
  true_shield_network:
    name: true-shield-network
    driver: bridge
