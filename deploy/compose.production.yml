name: true-shield-production

services:
  gateway:
    image: caddy:2.10-alpine
    container_name: true-shield-gateway
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../apps/api_server
    container_name: true-shield-api
    restart: unless-stopped
    env_file:
      - ${TRUE_SHIELD_ENV_FILE:-../.env.production}
    environment:
      APP_ENV: production
      DEBUG: "false"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      VOICE_FUNASR_CACHE_ROOT: /app/models/modelscope
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
    command:
      - sh
      - -c
      - uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    expose:
      - "8000"
    volumes:
      - voice_models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    container_name: true-shield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    container_name: true-shield-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: true-shield-minio
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: true-shield-production-postgres
  redis_data:
    name: true-shield-production-redis
  minio_data:
    name: true-shield-production-minio
  voice_models:
    name: true-shield-production-models
  caddy_data:
    name: true-shield-production-caddy-data
  caddy_config:
    name: true-shield-production-caddy-config

networks:
  edge:
    name: true-shield-production-edge
  backend:
    name: true-shield-production-backend
    internal: true
